# docker compose up --build        (then open http://localhost:8000)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: edupulse, POSTGRES_USER: edupulse, POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U edupulse"], interval: 5s, retries: 10 }
  web:
    build: .
    env_file: [.env]
    environment:
      DEBUG: "0"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: edupulse
      DB_USER: edupulse
      DB_PASSWORD: "${DB_PASSWORD:-change-me}"
      SECURE_SSL_REDIRECT: "0"      # TLS is terminated by your reverse proxy; set to 1 behind HTTPS
      HTTPS: "0"                     # set to 1 once you serve over HTTPS (secure cookies)
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [media:/app/media]
volumes: { pgdata: {}, media: {} }
