{% load ui %}{% with k=name|subj_kind %}
<script>(function(){var m=document.querySelector("main.content"); if(m) m.classList.add("kind-{{ k }}");})();</script>
{% if k == "math" %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>window.addEventListener("load",function(){ if(window.renderMathInElement){ renderMathInElement(document.querySelector("main.content"),{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false}); }});</script>
{% endif %}{% endwith %}
