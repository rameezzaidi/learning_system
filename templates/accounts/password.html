{% extends "base.html" %}{% load ui %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div><a class="btn ghost" href="{% url 'accounts:profile' %}">Back</a></div>
<form method="post" class="card" style="max-width:480px">{% csrf_token %}
  {% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}
  <button class="btn">{% icon "check" 18 %} Update password</button>
</form>
{% endblock %}
